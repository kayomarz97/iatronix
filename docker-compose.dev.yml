services:
  # Dev has its own isolated Postgres AND Redis — no shared state with any other
  # environment. (Prod runs on Cloud Run + Neon; this stack is local dev only.)

  iatronix-dev-db:
    image: pgvector/pgvector:pg16
    container_name: iatronix-dev-db
    restart: unless-stopped
    networks: [iatronix-net]
    env_file: .env.dev          # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - iatronix-dev-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medadmin -d medvectordb"]
      interval: 10s
      timeout: 5s
      retries: 5

  iatronix-dev-redis:
    image: redis:7-alpine
    container_name: iatronix-dev-redis
    restart: unless-stopped
    networks: [iatronix-net]
    volumes:
      - iatronix-dev-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  iatronix-dev-backend:
    build: ./backend
    container_name: iatronix-dev-backend
    restart: unless-stopped
    networks: [iatronix-net]
    depends_on:
      iatronix-dev-db:
        condition: service_healthy
      iatronix-dev-redis:
        condition: service_healthy
    env_file: .env.dev
    environment:
      DSPY_ENABLED: "true"
      ADAPTIVE_CROSS_STRATEGY_FALLBACK_ENABLED: "true"
      NON_MEDICAL_GUARD_ENABLED: "true"
      RELEVANCE_FLOOR_ENABLED: "true"
      RELEVANCE_SYNONYMS_ENABLED: "true"
      QUERY_SENSE_FRAMING_ENABLED: "true"
      ANALYSIS_TRUNCATION_FIX_ENABLED: "true"
      DIFFERENTIAL_DX_ENABLED: "true"
      TOPICALITY_GATE_ENABLED: "true"
      INTENT_FRAMING_ENABLED: "true"
      REFERENCE_FIRST_ENABLED: "true"
      CONTRADICTION_SURFACING_ENABLED: "true"
      CANDIDATE_CHAPTERS_ENABLED: "true"
      CITATION_INTEGRITY_FIX_ENABLED: "true"
      REFERENCE_FIRST_ALL_TYPES_ENABLED: "true"
      DRUG_ENTITY_GUARD_ENABLED: "true"
      # Docs said this was disabled; it was NOT (code default True, never set in .env.dev).
      # At threshold 0.88 a DIFFERENT clinical question can be served another question's
      # cached answer. Set explicitly here so dev matches documented intent.
      SEMANTIC_CACHE_ENABLED: "false"
      # .env.dev/.env pin 0.88, BELOW the >=0.9 floor test_m4_semantic_cache asserts. Align dev
      # to the config.py default (0.92) so that canary stays green and dev cannot silently drift
      # back to loose similarity matching. PROD .env still holds 0.88 - owner decision.
      SEMANTIC_CACHE_THRESHOLD: "0.92"
      TRIALS_WITH_RESULTS_ONLY_ENABLED: "true"
      EVIDENCE_TIER_LABELS_ENABLED: "true"
      CHAPTER_SCOPE_GUARD_ENABLED: "true"
      # Irrelevant-citation fixes (2026-08-02) — see
      # test/results/CITATION_RELEVANCE_2026-08-02.md. Retrieval-side + publication-side.
      BROAD_TERM_TITLE_SCOPE_ENABLED: "true"
      REFERENCE_PUBLICATION_GATE_ENABLED: "true"
      GUNICORN_WORKERS: "2"
    volumes:
      - ./backend/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    ports:
      - "127.0.0.1:8201:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  iatronix-dev-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    container_name: iatronix-dev-frontend
    restart: unless-stopped
    networks: [iatronix-net]
    depends_on:
      iatronix-dev-backend:
        condition: service_healthy
    environment:
      INTERNAL_API_URL: "http://iatronix-dev-backend:8000"
    ports:
      - "127.0.0.1:3201:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  iatronix-net:
    name: iatronix-net
    external: true   # shares the same network as prod (for DB access)

volumes:
  iatronix-dev-redis-data: {}
  iatronix-dev-pgdata: {}
